<!-- Login/Register Overlay -->
<div id="auth-overlay" class="fixed inset-0 bg-gray-50 z-50 flex items-center justify-center p-4">
  <div class="glass-card bg-white p-8 rounded-2xl max-w-md w-full shadow-2xl">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-green-600">Finance</h1>
      <p class="text-gray-500 text-sm">Log in or create an account</p>
    </div>
    <div id="auth-form-container">
      <!-- Login form -->
      <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
        <div>
          <label class="block text-sm font-medium text-gray-700">Username</label>
          <input type="text" id="login-username" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-green-500 focus:border-green-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Password</label>
          <input type="password" id="login-password" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-green-500 focus:border-green-500">
        </div>
        <button type="submit" class="w-full py-2 bg-green-600 hover:bg-green-700 text-white rounded-xl font-semibold">Log In</button>
      </form>
      <div class="text-center mt-4">
        <p class="text-sm text-gray-500">Don't have an account? <button onclick="showRegister()" class="text-green-600 hover:underline">Register</button></p>
      </div>
    </div>
    <div id="register-form-container" class="hidden">
      <form id="register-form" class="space-y-4" onsubmit="handleRegister(event)">
        <div>
          <label class="block text-sm font-medium text-gray-700">Username</label>
          <input type="text" id="register-username" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-green-500 focus:border-green-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Password (min 4 chars)</label>
          <input type="password" id="register-password" required minlength="4" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-green-500 focus:border-green-500">
        </div>
        <button type="submit" class="w-full py-2 bg-green-600 hover:bg-green-700 text-white rounded-xl font-semibold">Create Account</button>
      </form>
      <div class="text-center mt-4">
        <p class="text-sm text-gray-500">Already have an account? <button onclick="showLogin()" class="text-green-600 hover:underline">Log In</button></p>
      </div>
    </div>
  </div>
</div>
